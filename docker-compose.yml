# Root Docker Compose orchestrating all 4 production IoT services
# Usage: docker compose up --build
services:
  postgres:
    build:
      context: ./infra
      dockerfile: Dockerfile.postgres
    image: iot_postgres:latest
    container_name: iot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-iot_platform}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - iot_network

  mosquitto:
    build:
      context: ./infra
      dockerfile: Dockerfile.mosquitto
    image: iot_mosquitto:latest
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
    networks:
      - iot_network

  redis:
    image: redis:7-alpine
    container_name: iot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - iot_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: iot_backend:latest
    container_name: iot_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_started
    environment:
      PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-iot_platform}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      FCM_SERVER_KEY: "${FCM_SERVER_KEY:-}"
      FCM_CREDENTIALS_FILE: "${FCM_CREDENTIALS_FILE:-/etc/fcm/service-account.json}"
      FCM_SERVICE_ACCOUNT_JSON: "${FCM_SERVICE_ACCOUNT_JSON:-}"
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_BROKER_URL: "tcp://mosquitto:1883"
      MQTT_CLIENT_ID: "iot-backend-service"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-iot_admin_secret_key_2026}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      JWT_SECRET: "${JWT_SECRET:-iot_jwt_super_secret_key_2026}"
      MAX_TELEMETRY_RECORDS: "${MAX_TELEMETRY_RECORDS:-10000}"
      TELEMETRY_PRUNE_INTERVAL_SEC: "${TELEMETRY_PRUNE_INTERVAL_SEC:-30}"
    volumes:
      - ./infra/fcm:/etc/fcm:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - iot_network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: iot_frontend:latest
    container_name: iot_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - iot_network

volumes:
  pgdata:
  mosquitto_data:
  redis_data:


networks:
  iot_network:
    driver: bridge

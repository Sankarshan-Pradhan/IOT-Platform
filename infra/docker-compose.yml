services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: iot_postgres:latest
    container_name: iot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-iot_platform}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iot_user} -d ${POSTGRES_DB:-iot_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - iot_network

  mosquitto:
    build:
      context: .
      dockerfile: Dockerfile.mosquitto
    image: iot_mosquitto:latest
    container_name: iot_mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
    networks:
      - iot_network

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: iot_backend:latest
    container_name: iot_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-iot_user}:${POSTGRES_PASSWORD:-iot_secure_password}@postgres:5432/${POSTGRES_DB:-iot_platform}?sslmode=disable"
      MQTT_BROKER: "tcp://mosquitto:1883"
      MQTT_CLIENT_ID: "iot-backend-service"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-iot_admin_secret_key_2026}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
      JWT_SECRET: "${JWT_SECRET:-iot_jwt_super_secret_key_2026}"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - iot_network

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: iot_frontend:latest
    container_name: iot_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - iot_network

volumes:
  pgdata:
  mosquitto_data:

networks:
  iot_network:
    driver: bridge

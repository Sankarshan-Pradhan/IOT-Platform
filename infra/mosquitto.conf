# MQTT default port
listener 1883 0.0.0.0

# WebSocket listener (useful for web-based MQTT dashboards)
listener 9001 0.0.0.0
protocol websockets

# Allow anonymous access for local development
allow_anonymous true

# Production Authentication Note:
# To require per-device credentials in production:
# 1. Generate password file: mosquitto_passwd -c /mosquitto/config/password_file <username>
# 2. Set allow_anonymous to false:
# allow_anonymous false
# password_file /mosquitto/config/password_file

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

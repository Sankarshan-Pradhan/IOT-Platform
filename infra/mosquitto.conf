# MQTT default port
listener 1883 0.0.0.0

# WebSocket listener (useful for web-based MQTT dashboards)
listener 9001 0.0.0.0
protocol websockets

# Allow anonymous access for local development
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
